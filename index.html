<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://sdk.generative.ai/google-generative-ai.js"></script>
</head>
<body>
    <div id="api-key-container">
        <h1>Gemini API Key</h1>
        <p>Please enter your Gemini API key to continue.</p>
        <input type="password" id="api-key-input" placeholder="Enter your API Key">
        <button id="save-api-key-btn">Save</button>
    </div>

    <div id="personality-container" class="hidden">
        <button class="personality-btn" data-personality="知識型">🧠 知識型</button>
        <button class="personality-btn" data-personality="情感支持型">💗 情感支持型</button>
        <button class="personality-btn" data-personality="激勵型">🔥 激勵型</button>
        <button class="personality-btn active" data-personality="可愛陪伴型">🐾 可愛陪伴型</button>
    </div>

    <div id="chat-container" class="hidden">
        <div id="chat-history">
            <!-- Typing indicator stays here and toggles visibility -->
        </div>
        <div id="typing-indicator" class="hidden">
            <span></span><span></span><span></span>
        </div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Type your message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
