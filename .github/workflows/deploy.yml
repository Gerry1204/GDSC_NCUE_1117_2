name: Deploy to GitHub Pages

on:
  push:
    branches:
      - feature/gemini-chatbot

permissions:
  pages: write        # required for GitHub Pages
  id-token: write     # required for GitHub Pages
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 如果你有 build 步驟，例如 npm build，請在這裡補上
      # - name: Build
      #   run: |
      #     npm install
      #     npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # 你的靜態網頁放的資料夾

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
